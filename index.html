<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EF Dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Expert Freedom brand (getexpertfreedom.com) */
    --plum: #372037; --plum-2: #4a2f4a; --mauve: #867479; --lavender: #d2cbcd; --mist: #d7dde5;
    --tint: #f4f1f2; --bg: #f7f6f4; --card: #ffffff; --line: #e6e1e3; --text: #372037; --muted: #867479;
    --heading: 'Instrument Serif', Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.5 Karla, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  button, select, input { font: inherit; }
  .app { display: flex; min-height: 100vh; }
  .side { width: 220px; flex: none; background: var(--plum); color: #e9e3e6; padding: 20px 14px; display: flex; flex-direction: column; gap: 6px; }
  .brand { color: #fff; font-family: var(--heading); font-weight: 400; font-size: 22px; display: flex; align-items: center; gap: 10px; margin: 0 6px 18px; }
  .brand i { width: 28px; height: 28px; border-radius: 7px; background: var(--lavender); display: inline-flex; align-items: end; justify-content: center; gap: 3px; padding: 6px; }
  .brand i b { width: 3px; background: var(--plum); border-radius: 1px; }
  .nav { all: unset; cursor: pointer; padding: 10px 12px; border-radius: 8px; color: #e9e3e6; display: block; }
  .nav:hover { background: var(--plum-2); }
  .nav[aria-current="page"] { background: var(--lavender); color: var(--plum); font-weight: 700; }
  .side .foot { margin-top: auto; font-size: 12px; color: #bfb1b6; padding: 0 6px; }
  .side .foot button { all: unset; cursor: pointer; color: #e9e3e6; text-decoration: underline; }
  main { flex: 1; min-width: 0; padding: 22px 26px 40px; }
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .top h1 { margin: 0; font-family: var(--heading); font-weight: 400; font-size: 34px; line-height: 1.1; }
  .top .q { color: var(--muted); }
  .top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; background: var(--mist); color: var(--plum); }
  .pill.ok { background: var(--tint); color: var(--mauve); }
  .pill.warn { background: var(--lavender); color: var(--plum); }
  select, .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 10px; }
  .btn { cursor: pointer; }
  .btn.primary { background: var(--plum); border-color: var(--plum); color: #fff; font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-family: var(--heading); font-weight: 400; font-size: 22px; margin: 0 0 4px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .funnel { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 4px 2px 8px; }
  .step { flex: 1 0 112px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 10px; background: #fff; position: relative; }
  .step.gap { border: 2px solid var(--plum); background: var(--tint); }
  .step .name { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--mauve); }
  .step.gap .name { color: var(--plum); }
  .step .big { font-family: var(--heading); font-size: 30px; font-weight: 400; line-height: 1.1; margin: 6px 0 2px; }
  .step .small { color: var(--muted); font-size: 12.5px; }
  .badge { display: inline-block; background: var(--plum); color: #fff; border-radius: 6px; font-size: 11px; font-weight: 700; padding: 2px 7px; margin-top: 6px; }
  .arrow { flex: 0 0 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 11.5px; text-align: center; }
  .arrow span:first-child { font-size: 18px; line-height: 1; }
  .start { color: var(--plum); font-weight: 600; font-size: 13px; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font-size: 13px; background: #fff; }
  .chip b { margin: 0 4px; }
  .chip .t { color: var(--muted); }
  .chip.bad { border-color: var(--plum); border-left-width: 4px; background: #fff; }
  .chip.good { border-color: var(--mist); background: var(--tint); }
  .tgroups { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .tgroup h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mauve); font-weight: 700; }
  .tgroup .chips { margin-top: 0; flex-direction: column; align-items: flex-start; }
  .chip.na { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: right; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #f0f2f6; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
  tr.flag td { background: var(--tint); color: var(--mauve); }
  .scroll { overflow-x: auto; }
  .list { margin: 0; padding: 0; list-style: none; }
  .list li { padding: 8px 0; border-bottom: 1px solid #f0f2f6; font-size: 13px; }
  .list li:last-child { border-bottom: 0; }
  .muted { color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .kpis.three { grid-template-columns: repeat(3, 1fr); }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .kpi .label { font-size: 13px; color: var(--mauve); font-weight: 600; min-height: 38px; }
  .kpi .value { font-family: var(--heading); font-size: 46px; font-weight: 400; line-height: 1.1; margin: 10px 0 4px; }
  .kpi .note { font-size: 12.5px; color: var(--muted); }
  .lock { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .lock form { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: 100%; max-width: 360px; }
  .lock h1 { font-family: var(--heading); font-weight: 400; font-size: 30px; margin: 0 0 6px; }
  .lock input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin: 14px 0 10px; }
  .lock label { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .lock .err { color: var(--plum); font-weight: 600; font-size: 13px; min-height: 18px; }
  .lock .btn { width: 100%; padding: 10px; }
  .notice { background: var(--tint); color: var(--plum); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; }
  .loading { padding: 60px; text-align: center; color: var(--muted); }
  @media (max-width: 900px) {
    .app { flex-direction: column; }
    .side { width: auto; flex-direction: row; align-items: center; padding: 10px 12px; overflow-x: auto; }
    .brand { margin: 0 10px 0 0; font-size: 15px; }
    .side .foot { display: none; }
    main { padding: 16px; }
    .grid2, .kpis, .kpis.three, .tgroups { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"><div class="loading">Loading&#x2026;</div></div>

<script>
(function () {
  'use strict';
  var STORE_KEY = 'ef_dash_pass';
  var API_URL = 'https://script.google.com/macros/s/AKfycbzErSjTc3cP6K3W2tgIG9R3OtcoI6vNpejcwOhuZfhlYkos6MqjNX4xIkjaA3plgeVT/exec';
  var state = { pass: null, data: null, page: 'cro', period: null, loading: false };

  // ---------- storage (may be blocked inside an iframe) ----------
  function getStored() { try { return localStorage.getItem(STORE_KEY) || sessionStorage.getItem(STORE_KEY); } catch (e) { return null; } }
  function setStored(v, remember) {
    try { (remember ? localStorage : sessionStorage).setItem(STORE_KEY, v); } catch (e) {}
  }
  function clearStored() { try { localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY); } catch (e) {} }

  // ---------- server call ----------
  function fetchData(pass, fresh) {
    return new Promise(function (resolve, reject) {
      if (window.__PREVIEW__) {
        setTimeout(function () { pass === window.__PREVIEW__.pass ? resolve(window.__PREVIEW__.data) : reject(new Error('bad_passcode')); }, 150);
        return;
      }
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getData(pass, !!fresh);
        return;
      }
      // Hosted outside Google: call the Apps Script JSON endpoint without any Google login.
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ pass: pass, fresh: !!fresh }), credentials: 'omit', redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (j) { j && j.ok ? resolve(j.data) : reject(new Error((j && j.error) || 'load_failed')); })
        .catch(reject);
    });
  }

  // ---------- formatting ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function n0(v) { return v == null || !isFinite(v) ? '\u2013' : Math.round(v).toLocaleString('en-US'); }
  function money(v, dec) { if (v == null || !isFinite(v)) return '\u2013'; return '$' + v.toLocaleString('en-US', { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 }); }
  function pct(v) { return v == null || !isFinite(v) ? '\u2013' : (v * 100).toFixed(1) + '%'; }
  function mult(v) { return v == null || !isFinite(v) ? '\u2013' : v.toFixed(2) + 'x'; }
  function div(a, b) { return b ? a / b : null; }
  function fmtDate(iso) { var p = iso.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }); }
  function addDays(iso, k) { var p = iso.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + k)); return d.toISOString().slice(0, 10); }

  // ---------- funnel math ----------
  var FIELDS = ['spend', 'impressions', 'clicks', 'lpvs', 'appsStarted', 'appsCompleted', 'booked', 'shown', 'offers', 'sales', 'cash', 'revenue'];
  function sum(days) {
    var t = {}; FIELDS.forEach(function (f) { t[f] = 0; });
    days.forEach(function (d) { FIELDS.forEach(function (f) { if (d[f] != null) t[f] += d[f]; }); });
    return t;
  }
  function rates(t) {
    return {
      ctr: div(t.clicks, t.impressions), cpc: div(t.spend, t.clicks),
      clickToLpv: div(t.lpvs, t.clicks), costPerLpv: div(t.spend, t.lpvs),
      lpvToApp: div(t.appsStarted, t.lpvs), completion: div(t.appsCompleted, t.appsStarted),
      costPerApp: div(t.spend, t.appsCompleted), appToBooked: div(t.booked, t.appsCompleted),
      cpbc: div(t.spend, t.booked), showRate: div(t.shown, t.booked), costPerLiveCall: div(t.spend, t.shown),
      closeRate: div(t.sales, t.shown), cpa: div(t.spend, t.sales), aov: div(t.revenue, t.sales),
      coas: div(t.cash, t.spend), roas: div(t.revenue, t.spend)
    };
  }

  var TARGETS = [
    { key: 'cpbc', label: 'Cost per booked call', fmt: function (v) { return money(v); }, step: 4 },
    { key: 'showRate', label: 'Show rate', fmt: pct, step: 5 },
    { key: 'costPerLiveCall', label: 'Cost per live call', fmt: function (v) { return money(v); }, step: 5 },
    { key: 'closeRate', label: 'Close rate', fmt: pct, step: 6 },
    { key: 'cpa', label: 'Cost per sale', fmt: function (v) { return money(v); }, step: 6 },
    { key: 'coas', label: 'Cash back per $1 spent', fmt: mult, step: 6 },
    { key: 'roas', label: 'Revenue per $1 spent', fmt: mult, step: 6 }
  ];

  // Returns how far off target a value is (0 = on target, 0.5 = 50% worse). Null when it can't be judged.
  function judge(tgt, actual, r) {
    if (!tgt || actual == null || !isFinite(actual)) return null;
    var goal = tgt.value;
    if (tgt.kind === 'shareOfPrice') { if (r.aov == null) return null; goal = r.aov * tgt.value; }
    var miss = tgt.dir === 'max' ? (actual - goal) / goal : (goal - actual) / goal;
    return { goal: goal, miss: miss, ok: miss <= 0 };
  }
  function targetText(tgt, goal, def) {
    if (tgt.kind === 'shareOfPrice') return (tgt.dir === 'max' ? 'under ' : 'over ') + '\u00bc of the sale price' + (goal ? ' (' + money(goal) + ')' : '');
    return (tgt.dir === 'max' ? 'under ' : 'over ') + def.fmt(goal);
  }

  // ---------- periods ----------
  function allDays() {
    var f = state.data.funnel; var out = [];
    f.months.forEach(function (m) { m.days.forEach(function (d) { if (d.date <= f.today) out.push(d); }); });
    return out;
  }
  function periods() {
    var f = state.data.funnel; var list = [];
    list.push({ id: 'last7', label: 'Last 7 days' }, { id: 'last30', label: 'Last 30 days' });
    f.months.slice().reverse().forEach(function (m) { if (m.days.some(function (d) { return d.date <= f.today && FIELDS.some(function (k) { return d[k] != null; }); })) list.push({ id: 'm:' + m.key, label: m.tab }); });
    list.push({ id: 'ytd', label: 'All of ' + f.today.slice(0, 4) });
    return list;
  }
  function daysFor(pid) {
    var f = state.data.funnel; var t = f.today; var days = allDays();
    // A day only counts once someone has typed numbers in. Today is left out until it has numbers.
    if (pid === 'last7' || pid === 'last30') {
      var n = pid === 'last7' ? 7 : 30; var from = addDays(t, -n);
      return days.filter(function (d) { return d.date > from && d.date < t; });
    }
    if (pid === 'ytd') return days.filter(function (d) { return d.date.slice(0, 4) === t.slice(0, 4); });
    var key = pid.slice(2);
    var m = f.months.filter(function (x) { return x.key === key; })[0];
    return m ? m.days.filter(function (d) { return d.date <= t; }) : [];
  }
  function latestTargets() {
    var ms = state.data.funnel.months;
    for (var i = ms.length - 1; i >= 0; i--) if (Object.keys(ms[i].targets).length) return ms[i].targets;
    return {};
  }
  function gaps(days, today) {
    var out = [];
    days.forEach(function (d) {
      if (d.date >= today) return;
      var any = FIELDS.some(function (k) { return d[k] != null; });
      if (!any) out.push({ date: d.date, text: 'No numbers entered' });
      else if (d.spend == null || d.lpvs == null) out.push({ date: d.date, text: (d.spend == null ? 'Ad spend' : 'Page views') + ' missing, other numbers entered' });
    });
    return out;
  }

  // ---------- render ----------
  var root = document.getElementById('root');

  function renderLock(msg) {
    root.innerHTML =
      '<div class="lock"><form id="lockForm">' +
      '<h1>EF Dashboards</h1><div class="muted">Enter the team passcode to see the numbers.</div>' +
      '<input type="password" id="pass" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode" required>' +
      '<label><input type="checkbox" id="remember" checked> Remember me on this computer</label>' +
      '<div class="err" id="err">' + esc(msg || '') + '</div>' +
      '<button class="btn primary" type="submit" id="go">Open dashboards</button></form></div>';
    var form = document.getElementById('lockForm');
    document.getElementById('pass').focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var p = document.getElementById('pass').value.trim();
      var remember = document.getElementById('remember').checked;
      document.getElementById('go').disabled = true;
      document.getElementById('err').textContent = 'Checking\u2026';
      fetchData(p).then(function (data) {
        setStored(p, remember); state.pass = p; state.data = data; render();
      }).catch(function (err) {
        renderLock(/bad_passcode/.test(String(err && err.message || err)) ? 'That passcode didn\u2019t work.' : 'Could not load the dashboards. Try again in a minute.');
      });
    });
  }

  function shell(title, question, controls, body) {
    var stamp = state.data.fetchedAt ? new Date(state.data.fetchedAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
    return '<div class="app"><nav class="side" aria-label="Dashboards">' +
      '<div class="brand"><i aria-hidden="true"><b style="height:6px"></b><b style="height:11px"></b><b style="height:16px"></b></i>EF Dashboards</div>' +
      '<button class="nav" data-page="cro"' + (state.page === 'cro' ? ' aria-current="page"' : '') + '>CRO Dashboard</button>' +
      '<button class="nav" data-page="program"' + (state.page === 'program' ? ' aria-current="page"' : '') + '>Program Metrics</button>' +
      '<div class="foot">Updated ' + esc(stamp) + '<br><button id="refresh">Refresh now</button>' + (linkKey ? '' : ' \u00b7 <button id="logout">Lock</button>') + '</div>' +
      '</nav><main><div class="top"><h1>' + esc(title) + '</h1><span class="q">' + esc(question) + '</span><div class="right">' + controls + '</div></div>' + body + '</main></div>';
  }

  function wire() {
    Array.prototype.forEach.call(document.querySelectorAll('.nav'), function (b) {
      b.addEventListener('click', function () { state.page = b.getAttribute('data-page'); render(); });
    });
    var sel = document.getElementById('period');
    if (sel) sel.addEventListener('change', function () { state.period = sel.value; render(); });
    var r = document.getElementById('refresh');
    if (r) r.addEventListener('click', function () {
      r.textContent = 'Refreshing\u2026';
      fetchData(state.pass, true).then(function (d) { state.data = d; render(); }).catch(function () { r.textContent = 'Refresh failed, try again'; });
    });
    var l = document.getElementById('logout');
    if (l) l.addEventListener('click', function () { clearStored(); state.pass = null; state.data = null; renderLock(); });
  }

  function renderCro() {
    var f = state.data.funnel;
    if (!f || f.error || !f.months || !f.months.length) {
      return shell('CRO Dashboard', 'Which step of the book-a-call funnel needs work?', '',
        '<div class="card"><div class="notice">Couldn\u2019t read the VSL Tracker sheet right now' + (f && f.error ? ' (' + esc(f.error) + ')' : '') + '. Try Refresh in a few minutes.</div></div>');
    }
    var plist = periods();
    if (!state.period || !plist.some(function (p) { return p.id === state.period; })) state.period = plist[0].id;
    var days = daysFor(state.period);
    var entered = days.filter(function (d) { return FIELDS.some(function (k) { return d[k] != null; }); });
    var t = sum(days), r = rates(t), tg = latestTargets();
    var label = plist.filter(function (p) { return p.id === state.period; })[0].label;
    var gapList = gaps(days, f.today);

    // judge every target
    var judged = TARGETS.map(function (def) {
      var j = judge(tg[def.key], r[def.key], r);
      return { def: def, tgt: tg[def.key], actual: r[def.key], j: j };
    });
    var worst = null;
    judged.forEach(function (x) { if (x.j && !x.j.ok && (!worst || x.j.miss > worst.j.miss)) worst = x; });
    var gapStep = worst ? worst.def.step : -1;

    var steps = [
      { name: 'Meta ad', big: money(t.spend), small: n0(t.clicks) + ' clicks \u00b7 ' + pct(r.ctr) + ' click rate' },
      { name: 'VSL page', big: n0(t.lpvs), small: 'page views \u00b7 ' + money(r.costPerLpv, true) + ' each' },
      { name: 'App started', big: n0(t.appsStarted), small: 'started the application' },
      { name: 'App completed', big: n0(t.appsCompleted), small: money(r.costPerApp, true) + ' per completed app' },
      { name: 'Call booked', big: n0(t.booked), small: money(r.cpbc) + ' per booked call' },
      { name: 'Call shown', big: n0(t.shown), small: pct(r.showRate) + ' of booked calls showed' },
      { name: 'Sale', big: n0(t.sales), small: money(t.cash) + ' cash collected' }
    ];
    var arrows = [r.clickToLpv, r.lpvToApp, r.completion, r.appToBooked, r.showRate, r.closeRate];
    var funnel = '<div class="funnel">';
    steps.forEach(function (s, i) {
      var isGap = i === gapStep;
      funnel += '<div class="step' + (isGap ? ' gap' : '') + '"><div class="name">' + esc(s.name) + '</div>' +
        (isGap ? '<span class="badge">\u25b2 Biggest gap</span>' : '') +
        '<div class="big">' + s.big + '</div><div class="small">' + s.small + '</div>' +
        (isGap ? '<div class="start">Start here \u2191</div>' : '') + '</div>';
      if (i < arrows.length) funnel += '<div class="arrow" aria-label="moves on"><span>\u2192</span><span>' + pct(arrows[i]) + '</span></div>';
    });
    funnel += '</div>';

    var chipHtml = function (x) {
      if (!x.j) return '<span class="chip na">' + esc(x.def.label) + ' <b>\u2013</b><span class="t">' + esc(targetText(x.tgt, null, x.def)) + '</span></span>';
      return '<span class="chip ' + (x.j.ok ? 'good' : 'bad') + '">' + esc(x.def.label) + ' <b>' + x.def.fmt(x.actual) + '</b><span class="t">target ' + esc(targetText(x.tgt, x.j.goal, x.def)) + '</span></span>';
    };
    var withTgt = judged.filter(function (x) { return x.tgt; });
    var offList = withTgt.filter(function (x) { return x.j && !x.j.ok; }).sort(function (a, b) { return b.j.miss - a.j.miss; });
    var onList = withTgt.filter(function (x) { return x.j && x.j.ok; });
    var naList = withTgt.filter(function (x) { return !x.j; });
    var chips = '<div class="tgroups">' +
      '<div class="tgroup"><h3>Needs work (' + offList.length + ')</h3><div class="chips">' + (offList.length ? offList.map(chipHtml).join('') : '<span class="muted">Nothing. Every target is met.</span>') + '</div></div>' +
      '<div class="tgroup"><h3>On target (' + onList.length + ')</h3><div class="chips">' + (onList.length ? onList.map(chipHtml).join('') : '<span class="muted">None yet.</span>') + '</div>' + (naList.length ? '<p class="muted" style="margin:10px 0 0;font-size:13px">Not enough data to judge yet: ' + naList.map(function (x) { return esc(x.def.label.toLowerCase()); }).join(', ') + '.</p>' : '') + '</div></div>';

    var headline = worst
      ? '<p class="sub"><b>' + esc(worst.def.label) + '</b> is furthest from target: ' + worst.def.fmt(worst.actual) + ' against ' + esc(targetText(worst.tgt, worst.j.goal, worst.def)) + '.</p>'
      : '<p class="sub">Every step with a target is on target for this period.</p>';

    var notes = [];
    if (r.showRate != null && days.some(function (d) { return d.date >= addDays(f.today, -14) && d.booked; }))
      notes.push('Some calls booked in the last two weeks may not have happened yet, so the show rate and close rate can look low until they do.');
    if (t.sales > 0 && t.sales < 5) notes.push('Only ' + t.sales + ' sale' + (t.sales === 1 ? '' : 's') + ' in this period, so cost per sale and return on spend swing a lot with each new sale.');

    var rows = days.slice().reverse().map(function (d) {
      var flagged = gapList.some(function (g) { return g.date === d.date; });
      var dr = rates(sum([d]));
      return '<tr' + (flagged ? ' class="flag"' : '') + '><td>' + fmtDate(d.date) + '</td><td>' + money(d.spend) + '</td><td>' + n0(d.lpvs) + '</td><td>' + n0(d.appsStarted) + '</td><td>' + n0(d.appsCompleted) + '</td><td>' + n0(d.booked) + '</td><td>' + money(dr.cpbc) + '</td><td>' + n0(d.shown) + '</td><td>' + n0(d.sales) + '</td><td>' + money(d.cash) + '</td></tr>';
    }).join('');
    var table = '<div class="scroll"><table><thead><tr><th>Day</th><th>Spend</th><th>Page views</th><th>Apps started</th><th>Apps done</th><th>Booked</th><th>Per booked call</th><th>Shown</th><th>Sales</th><th>Cash</th></tr></thead><tbody>' +
      '<tr class="total"><td>Total</td><td>' + money(t.spend) + '</td><td>' + n0(t.lpvs) + '</td><td>' + n0(t.appsStarted) + '</td><td>' + n0(t.appsCompleted) + '</td><td>' + n0(t.booked) + '</td><td>' + money(r.cpbc) + '</td><td>' + n0(t.shown) + '</td><td>' + n0(t.sales) + '</td><td>' + money(t.cash) + '</td></tr>' +
      rows + '</tbody></table></div>';

    var gapCard = '<div class="card"><h2>Tracker check</h2><p class="sub">Days before today that look incomplete in the VSL Tracker.</p>' +
      (gapList.length ? '<ul class="list">' + gapList.slice().reverse().map(function (g) { return '<li><b>' + fmtDate(g.date) + '</b> \u00b7 ' + esc(g.text) + '</li>'; }).join('') + '</ul>' : '<div class="muted">No gaps. Every day has numbers.</div>') +
      (notes.length ? '<h2 style="margin-top:16px">Worth knowing</h2><ul class="list">' + notes.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' : '') + '</div>';

    var controls = '<select id="period" aria-label="Time period">' + plist.map(function (p) { return '<option value="' + p.id + '"' + (p.id === state.period ? ' selected' : '') + '>' + esc(p.label) + '</option>'; }).join('') + '</select>' +
      '<span class="pill">From VSL Tracker</span>' +
      (gapList.length ? '<span class="pill warn">' + gapList.length + ' tracker gap' + (gapList.length === 1 ? '' : 's') + '</span>' : '<span class="pill ok">Tracker complete</span>');

    var body = '<div class="card"><h2>Book-a-call funnel \u00b7 ' + esc(label) + '</h2>' + headline + (entered.length ? funnel + chips : '<div class="notice">No numbers in the tracker for this period yet.</div>') + '</div>' +
      '<div class="grid2"><div class="card"><h2>Day by day</h2><p class="sub">Highlighted days are incomplete in the tracker.</p>' + table + '</div>' + gapCard + '</div>';
    return shell('CRO Dashboard', 'Which step of the book-a-call funnel needs work?', controls, body);
  }

  function renderProgram() {
    var card = function (label, value, note) { return '<div class="kpi"><div class="label">' + esc(label) + '</div><div class="value">' + esc(value == null ? '\u2013' : value) + '</div><div class="note">' + esc(note || '') + '</div></div>'; };
    var p = state.data.program || {};
    var kpiBlock;
    if (p.error) {
      var why = p.error === 'not_shared' || p.error === 'no_token'
        ? 'Waiting on access to the Headline KPIs table in Notion. Once it\u2019s shared with the dashboard, these numbers show up here on their own.'
        : 'Couldn\u2019t read the Headline KPIs table in Notion right now (' + esc(p.error) + '). Try Refresh in a few minutes.';
      kpiBlock = '<div class="card"><h2>First 90 days</h2><div class="notice">' + why + '</div></div>';
    } else {
      kpiBlock = '<div class="card"><h2>First 90 days</h2><div class="kpis">' +
        card('Engaged students who signed a client within 90 days', p.signedIn90) +
        (function () { var m = String(p.engagementRate || '').match(/^(.*?)\s*\((.*)\)\s*$/); return m ? card('Program engagement rate', m[1], m[2] + ' students engaged') : card('Program engagement rate', p.engagementRate); })() +
        card('Average revenue in the first 90 days', p.avg90 == null ? null : money(p.avg90)) +
        card('Median revenue in the first 90 days', p.median90 == null ? null : money(p.median90)) +
        '</div><p class="muted" style="margin-top:14px">Students who joined March 1, 2026 or later. From Jennifer\u2019s Headline KPIs table in Notion' +
        (p.lastUpdated ? ', last updated ' + esc(fmtDate(p.lastUpdated)) : '') + '.</p></div>';
    }
    return shell('Program Metrics', 'How are students doing, and are they showing up?', '<span class="pill">From Notion</span>', kpiBlock + renderEngagement(card));
  }

  function renderEngagement(card) {
    var e = state.data.engagement || {};
    var head = '<h2>Monthly engagement</h2>';
    if (e.error) {
      var why = e.error === 'not_shared' || e.error === 'no_token'
        ? 'Waiting on access to the Program Pulse page in Notion. Once it\u2019s shared with the dashboard, the monthly engagement numbers show up here on their own.'
        : 'Couldn\u2019t read the Engagement Pulse table in Notion right now (' + esc(e.error) + '). Try Refresh in a few minutes.';
      return '<div class="card" style="margin-top:16px">' + head + '<div class="notice">' + why + '</div></div>';
    }
    var months = e.months || [];
    if (!months.length) return '<div class="card" style="margin-top:16px">' + head + '<div class="notice">No months in the Engagement Pulse table yet.</div></div>';
    var label = function (m) { return m.month + (m.year && String(m.month).indexOf(String(m.year)) < 0 ? ' ' + m.year : ''); };
    var last = months[months.length - 1], prev = months.length > 1 ? months[months.length - 2] : null;
    var change = function (k) {
      if (!prev || last[k] == null || prev[k] == null) return '';
      var d = (last[k] - prev[k]) * 100;
      if (Math.abs(d) < 0.05) return 'Same as ' + prev.month;
      return (d > 0 ? 'Up ' : 'Down ') + Math.abs(d).toFixed(1) + ' points from ' + prev.month;
    };
    var cards = '<div class="kpis three">' +
      card('Overall engagement rate', pct(last.overall), change('overall')) +
      card('Community engagement (Skool)', pct(last.community), change('community')) +
      card('Coaching call rate', pct(last.callRate), (last.studentsAtCalls != null && last.currentStudents != null ? n0(last.studentsAtCalls) + ' of ' + n0(last.currentStudents) + ' current students' : change('callRate'))) +
      '</div>';
    var rows = months.slice().reverse().map(function (m) {
      return '<tr><td>' + esc(label(m)) + (m.status === 'Partial' ? ' <span class="muted">(partial)</span>' : '') + '</td><td>' + pct(m.overall) + '</td><td>' + pct(m.community) + '</td><td>' + pct(m.callRate) + '</td><td>' + n0(m.studentsAtCalls) + '</td><td>' + n0(m.currentStudents) + '</td></tr>';
    }).join('');
    var table = '<div class="scroll" style="margin-top:16px"><table><thead><tr><th>Month</th><th>Overall</th><th>Community</th><th>Coaching calls</th><th>Students at a call</th><th>Current students</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    return '<div class="card" style="margin-top:16px">' + head +
      '<p class="sub">' + esc(label(last)) + (last.status === 'Partial' ? ' (month still in progress)' : '') + '. The overall rate blends community engagement and the coaching call rate, using the weights set in Notion.</p>' +
      cards + table +
      '<p class="muted" style="margin-top:14px">From the Engagement Pulse table on Jennifer\u2019s Program Pulse page in Notion. Updated monthly.</p></div>';
  }

  function render() {
    root.innerHTML = state.page === 'program' ? renderProgram() : renderCro();
    wire();
  }

  // ---------- start ----------
  // The HighLevel menu link carries the key as ?k=..., so staff never type a passcode.
  var linkKey = null;
  try { linkKey = new URLSearchParams(location.search).get('k'); } catch (e) {}
  var saved = linkKey || getStored();
  if (saved) {
    fetchData(saved).then(function (d) { state.pass = saved; state.data = d; render(); })
      .catch(function (err) { if (/bad_passcode/.test(String(err && err.message || err))) clearStored(); renderLock(); });
  } else {
    renderLock();
  }
})();
</script>
</body>
</html>
